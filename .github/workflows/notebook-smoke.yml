name: Notebook smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Test on notebook runner
    runs-on: [self-hosted, linux, x64, notebook]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install project with dev extras
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Pytest
        run: .venv/bin/python -m pytest tests/ -q
      - name: CLI version
        run: .venv/bin/opsai --version
