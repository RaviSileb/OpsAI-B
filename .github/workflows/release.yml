name: Release

on:
  push:
    tags: ["v*"]

# NOTE: release stays on GitHub-hosted runners (multi-arch build). It needs
# GitHub Actions minutes (billing); to cut a release from the notebook,
# change runs-on below to [self-hosted, linux, x64, notebook] and drop
# linux/arm64 from platforms.
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Build, publish and attach artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build .deb and AppImage
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install -e .
          bash packaging/linux/build_deb.sh
          bash packaging/linux/appimage/build_appimage.sh
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            packaging/linux/dist/*.deb
            packaging/linux/dist/*.AppImage
            sbom.cyclonedx.json
          generate_release_notes: true
