name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  appsec:
    name: Dependency, SAST and secret scans
    runs-on: [self-hosted, linux, x64, notebook]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install project with dev extras
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: pip-audit (fail on any known vuln)
        run: .venv/bin/pip-audit
      - name: Bandit (fail on medium+)
        run: .venv/bin/bandit -q -c .bandit -r opsai -ll
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: Image scan and SBOM
    runs-on: [self-hosted, linux, x64, notebook]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: opsai-a:scan
          load: true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsai-a:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-*.sarif
          retention-days: 30
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: opsai-a:scan
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: opsai-sbom
          path: sbom.cyclonedx.json
          retention-days: 30
