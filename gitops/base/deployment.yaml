apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsai
  labels:
    app.kubernetes.io/name: opsai
spec:
  replicas: 1
  # TZ CON-102: single replica, session state lives on the attached volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opsai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsai
          image: ghcr.io/ravisileb/opsai-a:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: opsai-config
          env:
            - name: OPSAI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: opsai-secrets
                  key: master-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opsai-data
        - name: tmp
          emptyDir: {}
