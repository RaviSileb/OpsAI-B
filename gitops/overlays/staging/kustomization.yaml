apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opsai-staging
resources:
  - ../../base
  - namespace.yaml
nameSuffix: -staging
images:
  - name: ghcr.io/ravisileb/opsai-a
    newTag: latest
configMapGenerator:
  - name: opsai-config
    behavior: merge
    literals:
      - OPSAI_LOG_LEVEL=DEBUG
