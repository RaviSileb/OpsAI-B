apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsai-staging
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: opsai=ghcr.io/ravisileb/opsai-a
    argocd-image-updater.argoproj.io/opsai.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  project: opsai
  source:
    repoURL: https://github.com/RaviSileb/OpsAI-A.git
    targetRevision: main
    path: gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: opsai-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
