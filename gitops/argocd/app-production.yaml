apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsai-production
  namespace: argocd
spec:
  project: opsai
  source:
    repoURL: https://github.com/RaviSileb/OpsAI-A.git
    targetRevision: main
    path: gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: opsai
  syncPolicy:
    # Production syncs manually: promote by updating the image tag in
    # gitops/overlays/production/kustomization.yaml, then sync in ArgoCD.
    syncOptions:
      - CreateNamespace=true
