apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsai.fullname" . }}
  labels:
    {{- include "opsai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # TZ CON-102: single replica, session state lives on the attached volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opsai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsai.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "opsai.fullname" . }}-config
          env:
            - name: OPSAI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsai.fullname" . }}-secrets
                  key: master-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "opsai.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
