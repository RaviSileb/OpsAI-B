apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsai.fullname" . }}
  labels:
    {{- include "opsai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "opsai.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsai.fullname" . }}-config
  labels:
    {{- include "opsai.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opsai.fullname" . }}-data
  labels:
    {{- include "opsai.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
{{- if .Values.secrets.masterKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsai.fullname" . }}-secrets
  labels:
    {{- include "opsai.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ .Values.secrets.masterKey | quote }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opsai.fullname" . }}
  labels:
    {{- include "opsai.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opsai.fullname" . }}
                port:
                  name: http
{{- end }}
