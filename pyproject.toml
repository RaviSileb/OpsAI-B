[project]
name = "opsai"
version = "0.1.0"
description = "OpsAI variant B - AI assistant for log analysis and remediation (Linux MVP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ivar Belis" }]
keywords = ["log-analysis", "ai", "nicegui", "ops"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "nicegui>=3.12,<4",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dateutil>=2.9",
  "charset-normalizer>=3.3",
  "orjson>=3.10",
  "httpx>=0.27",
  "websockets>=13",
  "keyring>=25",
  "cryptography>=42",
  "argon2-cffi>=23",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "croniter>=2.0",
  "confluent-kafka>=2.5",
  "pyyaml>=6.0",
  "pypsrp>=0.8",
  "azure-identity>=1.16",
  "duckdb>=1.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
storage = ["duckdb>=1.0", "pyarrow>=16"]
patterns = ["drain3>=0.9.11"]
pii = ["presidio-analyzer>=2.2"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
pdf = ["weasyprint>=62"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-python-dateutil",
  "drain3>=0.9.11",
  "presidio-analyzer>=2.2",
]

[project.scripts]
opsai = "opsai.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsai*"]

[tool.setuptools.package-data]
opsai = ["i18n/*.json", "prompts/*.jinja", "prompts/playbooks/*.yaml", "auth/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"opsai/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: tests against the real Meta Model API (need OPSAI_META_API_KEY)"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv/", "build/", "dist/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
