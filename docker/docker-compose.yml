name: opsai

services:
  opsai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: opsai-a:local
    container_name: opsai-a
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - opsai-data:/data:rw
    environment:
      OPSAI_MODE: server
      OPSAI_EXECUTION_ENABLED: "false"
      OPSAI_RESTRICTED_MODE: "false"
      OPSAI_LOG_LEVEL: INFO
      OPSAI_LANGUAGE: cs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  opsai-data:
